  blocked_files: []
  goal: Implement the manifest JSON Schema (v1), TypeScript types, vocabulary exports (TemplateName, IconName, TEMPLATE_NAMES, ICON_NAMES, CAPABILITIES), and validateManifest() function with structural, semantic, and cross-reference validation.
  tasks:
    - Add required dependencies (JSON Schema validator, YAML parser) to packages/schema/package.json.
    - Define TemplateName and IconName types and runtime arrays in vocabulary.ts.
    - Define DashboardManifest, PageDefinition, NavigationItem, PageCapabilities types in types.ts.
    - Define the JSON Schema (draft 2020-12) for manifest v1 in schema.ts.
    - Implement validateManifest() with structural, semantic, and cross-reference validation in validate.ts.
    - Export all public API from index.ts.
    - Write unit tests for validation edge cases.
  exit_criteria:
