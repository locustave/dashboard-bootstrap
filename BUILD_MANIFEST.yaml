  goal: Implement the approved docs/DESIGN_SYSTEM.md contract as executable code — design tokens, MUI theme configuration, and DashboardThemeProvider component. Do not rewrite or reinterpret DESIGN_SYSTEM.md.
  tasks:
    - Read docs/DESIGN_SYSTEM.md as the authoritative visual contract.
    - Add React, MUI, and related peer/dev dependencies to packages/design-system/package.json.
