  name: Monorepo Foundation
  dependency_layer: 0
  risk_score: 1
  rollback_checkpoint_required: true
  deliverables:
    - monorepo-foundation
  allowed_files:
    - package.json
    - pnpm-workspace.yaml
    - pnpm-lock.yaml
    - turbo.json
    - tsconfig.base.json
    - .npmrc
    - .gitignore
    - packages/design-system/package.json
    - packages/design-system/tsconfig.json
    - packages/design-system/src/index.ts
    - packages/templates/package.json
    - packages/templates/tsconfig.json
    - packages/templates/src/index.ts
    - packages/schema/package.json
    - packages/schema/tsconfig.json
    - packages/schema/src/index.ts
    - packages/generator/package.json
    - packages/generator/tsconfig.json
    - packages/generator/src/index.ts
    - packages/cli/package.json
    - packages/cli/tsconfig.json
    - packages/cli/src/index.ts
  blocked_files: []
  goal: Set up pnpm workspace, Turborepo pipeline, root package.json, shared tsconfig, and empty package scaffolds for all five packages (design-system, templates, schema, generator, cli).
  tasks:
    - Create root package.json with pnpm workspace configuration and shared dev dependencies (TypeScript).
    - Create pnpm-workspace.yaml defining packages/* and examples/* workspaces.
    - Create turbo.json with build, test, and lint pipelines.
    - Create tsconfig.base.json with shared TypeScript settings (ES2022, strict).
    - Scaffold package.json for each of the five packages with correct workspace dependency DAG.
    - Create minimal tsconfig.json extending the base in each package.
    - Create minimal src/index.ts placeholder in each package.
    - Run pnpm install and pnpm build.
  exit_criteria:
    - pnpm install exits 0.
    - pnpm build exits 0.
  out_of_scope:
    - Deliverables belonging to other phases.

